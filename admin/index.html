<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | SHARIN ALI</title>
  <style>
    body{font-family:Arial,sans-serif;background:#08101f;color:#fff;margin:0;padding:20px}
    .wrap{max-width:1000px;margin:auto}
    textarea{width:100%;min-height:540px;border-radius:14px;padding:15px;background:#111a2e;color:#fff;border:1px solid #334155;font-family:monospace;direction:ltr}
    button{border:0;border-radius:12px;background:#d7a84f;color:#111;padding:12px 18px;font-weight:700;cursor:pointer;margin:8px 4px}
    .box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;margin-bottom:16px}
    code{color:#d7a84f}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Panel — SHARIN ALI</h1>
    <div class="box">
      <p>ئەم Admin Panel ـە بۆ گۆڕینی ناوەڕۆکەکەیە. فایلی <code>content/site.json</code> بخەرە ناو خانەکە، دەستکاری بکە، پاشان Download بکە و لە شوێنی خۆی دایبنێ.</p>
      <input type="file" id="fileInput" accept="application/json">
      <button id="formatBtn">Format JSON</button>
      <button id="downloadBtn">Download site.json</button>
    </div>
    <textarea id="jsonEditor" spellcheck="false"></textarea>
  </div>
  <script>
    const editor=document.getElementById('jsonEditor');
    document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>editor.value=r.result;r.readAsText(f)});
    document.getElementById('formatBtn').onclick=()=>{try{editor.value=JSON.stringify(JSON.parse(editor.value),null,2)}catch(e){alert('JSON هەڵەیە: '+e.message)}};
    document.getElementById('downloadBtn').onclick=()=>{try{JSON.parse(editor.value);const blob=new Blob([editor.value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='site.json';a.click();URL.revokeObjectURL(a.href)}catch(e){alert('JSON هەڵەیە: '+e.message)}};
  </script>
</body>
</html>
