<!DOCTYPE html>
<html lang="ckb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EXINFLIX - یاری پێشبرکێ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    /* وێنەکە بە تەواوی شاشە دەگرێتەوە */
    .fullscreen-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* 15% خوارەوەی شاشە - پانێلی زانیاری */
    .info-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 15%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      color: white;
      font-family: 'Exinflix Bold', sans-serif;
      border-top: 2px solid #FF006E;
    }
    .player-card {
      text-align: center;
      flex: 1;
    }
    .player-name { font-size: 1.8rem; margin-bottom: 0.25rem; }
    .player-time { font-size: 2rem; font-family: monospace; color: #FFD700; }
    .middle-section {
      text-align: center;
      flex: 1;
      font-size: 1.5rem;
    }
    .category-name {
      background: #FF006E;
      display: inline-block;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 1rem;
    }
    .status { margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.8; }
    @media (max-width: 768px) {
      .player-name { font-size: 1rem; }
      .player-time { font-size: 1.2rem; }
      .middle-section { font-size: 0.9rem; }
      .info-panel { padding: 0 0.5rem; }
    }
  </style>
</head>
<body>
  <img id="currentImage" class="fullscreen-image" src="https://placehold.co/1920x1080/1A1A2E/FF006E?text=ئامادەی?">
  <div class="info-panel">
    <div class="player-card" id="player1Card">
      <div class="player-name" id="player1Name">...</div>
      <div class="player-time" id="player1Time">00:00</div>
    </div>
    <div class="middle-section">
      <div class="category-name" id="gameCategory">...</div>
      <div class="status" id="gameStatus">چاوەڕوانی دەستپێکردن</div>
    </div>
    <div class="player-card" id="player2Card">
      <div class="player-name" id="player2Name">...</div>
      <div class="player-time" id="player2Time">00:00</div>
    </div>
  </div>

  <script>
    // وەرگرتنی داتاکان لە localStorage
    const players = JSON.parse(localStorage.getItem('game_selected_players'));
    const category = localStorage.getItem('game_category');
    const settings = JSON.parse(localStorage.getItem('game_settings')) || { playerTime: 45, passTime: 3 };
    
    if (!players || !category) {
      alert('هەڵە: تکایە لە پەڕەی سەرەکیەوە دەستپێبکە');
      window.location.href = 'index.html';
    }
    
    // ناوی یاریزانەکان
    let player1Name = players.player1;
    let player2Name = players.player2;
    let currentPlayer = 1; // 1 یان 2
    let timeLeft1 = settings.playerTime;
    let timeLeft2 = settings.playerTime;
    let timerInterval = null;
    let isGameActive = true;
    let currentImageIndex = 0;
    
    // لیستی وێنەکان (دەتوانیت زیاد یا کەم بکەیت یان لە ئەدمینەوە ڕێکی بخەیت)
    const imageList = [
      'https://placehold.co/1920x1080/1A1A2E/FF006E?text=پرسیار+1',
      'https://placehold.co/1920x1080/1A1A2E/FF7A00?text=پرسیار+2',
      'https://placehold.co/1920x1080/1A1A2E/7B2CFF?text=پرسیار+3',
      'https://placehold.co/1920x1080/1A1A2E/FF006E?text=پرسیار+4',
      'https://placehold.co/1920x1080/1A1A2E/FF7A00?text=پرسیار+5'
    ];
    
    // نمایش داتاکان لە UI
    document.getElementById('player1Name').innerText = player1Name;
    document.getElementById('player2Name').innerText = player2Name;
    document.getElementById('gameCategory').innerText = category;
    
    function updateTimerDisplay() {
      const minutes1 = Math.floor(timeLeft1 / 60);
      const seconds1 = timeLeft1 % 60;
      const minutes2 = Math.floor(timeLeft2 / 60);
      const seconds2 = timeLeft2 % 60;
      document.getElementById('player1Time').innerText = `${minutes1.toString().padStart(2,'0')}:${seconds1.toString().padStart(2,'0')}`;
      document.getElementById('player2Time').innerText = `${minutes2.toString().padStart(2,'0')}:${seconds2.toString().padStart(2,'0')}`;
    }
    
    function nextImage() {
      currentImageIndex = (currentImageIndex + 1) % imageList.length;
      document.getElementById('currentImage').src = imageList[currentImageIndex];
    }
    
    function switchPlayer() {
      if (timerInterval) clearInterval(timerInterval);
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      document.getElementById('gameStatus').innerText = `کاتی یاریزانی ${currentPlayer === 1 ? player1Name : player2Name}`;
      startTimerForCurrentPlayer();
      nextImage(); // وێنەی نوێ بۆ یاریزانی دواتر
    }
    
    function startTimerForCurrentPlayer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isGameActive) return;
        if (currentPlayer === 1) {
          if (timeLeft1 <= 0) {
            clearInterval(timerInterval);
            alert(`کاتی یاریزانی ${player1Name} تەواو بوو! براوە: ${player2Name}`);
            isGameActive = false;
            return;
          }
          timeLeft1--;
        } else {
          if (timeLeft2 <= 0) {
            clearInterval(timerInterval);
            alert(`کاتی یاریزانی ${player2Name} تەواو بوو! براوە: ${player1Name}`);
            isGameActive = false;
            return;
          }
          timeLeft2--;
        }
        updateTimerDisplay();
      }, 1000);
    }
    
    // ========== کارلێکەکانی کیبۆرد ==========
    document.addEventListener('keydown', (e) => {
      if (!isGameActive) return;
      
      // دوگمەی Enter: وەڵامی "دروست"
      if (e.key === 'Enter') {
        e.preventDefault();
        if (currentPlayer === 1) {
          // ناوی دروست: کاتی یاریزانی یەکەم ڕادەوەستێت، یاریزانی دووەم دەست پێدەکات
          clearInterval(timerInterval);
          switchPlayer();
        } else {
          clearInterval(timerInterval);
          switchPlayer();
        }
      }
      
      // دوگمەی Space: "پاس" - هەمان یاریزان دەمێنێتەوە، وێنە دەگۆڕێت، کەمی کات بە passTime
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        if (currentPlayer === 1) {
          timeLeft1 = Math.max(0, timeLeft1 - settings.passTime);
        } else {
          timeLeft2 = Math.max(0, timeLeft2 - settings.passTime);
        }
        updateTimerDisplay();
        nextImage(); // وێنەی نوێ بۆ هەمان یاریزان
        // تایمەر بەردەوام دەبێت (نادوڕێت)
      }
    });
    
    updateTimerDisplay();
    document.getElementById('gameStatus').innerText = `کاتی یاریزانی ${player1Name}`;
    startTimerForCurrentPlayer();
    
    // قەدەغەکردنی کلیکی ڕاست و دەستکاری
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
