<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - The Floor</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <h1>🛠️ پەڕەی بەڕێوەبردن - The Floor</h1>
        <p id="data-status" style="color:#D4AF37; margin-bottom:20px;"></p>
        
        <!-- Players Management -->
        <div class="admin-card">
            <h2>👥 بەڕێوەبردنی یاریزانان</h2>
            <div class="input-group">
                <input type="text" id="new-player-name" placeholder="ناوی یاریزانی نوێ">
                <button id="add-player-btn" class="btn-admin">➕ زیادکردن</button>
            </div>
            <div id="players-list" class="items-list"></div>
        </div>
        
        <!-- Game Settings -->
        <div class="admin-card">
            <h2>⚙️ ڕێکخستنەکانی یاری</h2>
            <div class="settings-group">
                <label>⏱️ کاتی هەر یاریکەر (چرکە):</label>
                <input type="number" id="total-time" min="10" max="120" step="5">
            </div>
            <div class="settings-group">
                <label>⚠️ سزای پەڕاندن (چرکە):</label>
                <input type="number" id="pass-penalty" min="1" max="20" step="1">
            </div>
            <button id="save-settings" class="btn-gold">💾 پاشەکەوتکردنی ڕێکخستنەکان</button>
        </div>
        
        <!-- Categories Management -->
        <div class="admin-card">
            <h2>📂 زیادکردنی ناو بۆ کاتەگۆرییەکان</h2>
            <select id="admin-category"></select>
            <input type="text" id="new-item-name" placeholder="ناوی نوێ (بۆ نموونە: کەرکوک)">
            <button id="add-item-btn" class="btn-admin">➕ زیادکردن</button>
        </div>
        
        <div class="admin-card">
            <h2>➕ دروستکردنی کاتەگۆری نوێ</h2>
            <input type="text" id="new-category-name" placeholder="ناوی کاتەگۆری نوێ (بۆ نموونە: colors)">
            <button id="add-category-btn" class="btn-admin">📁 دروستکردنی کاتەگۆری</button>
        </div>
        
        <button id="download-data" class="btn-gold">💾 دابەزاندنی هەموو داتاکان (JSON)</button>
        <button id="upload-data" class="btn-admin" style="margin-top:15px; background:#2E7D32;">📤 بارکردنی JSON فایل</button>
        <input type="file" id="upload-file-input" accept=".json" style="display:none;">
    </div>
    <script src="admin-script.js"></script>
</body>
</html>
