<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Floor - Duel Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>⚡ THE FLOOR ⚡</h1>
            <p>دوارەکە - لە ٤٥ چرکەدا بڕیار بدرێت</p>
        </header>

        <!-- Players Setup Section -->
        <div id="setup-section" class="setup-card glass">
            <h2>🧠 دیاریکردنی یاری</h2>
            <div class="players-input">
                <div class="input-group">
                    <label>🎮 یاریکەری یەکەم</label>
                    <input type="text" id="player1-name" placeholder="ناوەکە بنووسە" value="ئارام">
                </div>
                <div class="input-group">
                    <label>⚔️ یاریکەری دووەم</label>
                    <input type="text" id="player2-name" placeholder="ناوەکە بنووسە" value="ژوان">
                </div>
            </div>

            <div class="category-select">
                <label>📂 هەڵبژاردنی بابەت (کاتەگۆری)</label>
                <select id="category-select">
                    <option value="animals">🦁 ئاژەڵان</option>
                    <option value="birds">🦜 باڵندەکان</option>
                    <option value="flags">🏁 ئاڵای وڵاتان</option>
                    <option value="maps">🗺️ نەخشەی وڵاتان</option>
                    <option value="players">⚽ ناوی یاریزانان</option>
                    <option value="leaders">👑 ناوی سەرۆکەکان</option>
                    <option value="celebrities">⭐ کەسایتی گەورە</option>
                    <option value="furniture">🛋️ کەل و پەل</option>
                    <option value="cars">🚗 ئۆتۆمبێل</option>
                    <option value="brands">🏷️ لۆگۆی براندەکان</option>
                    <option value="car-logos">🚘 لۆگۆی ئۆتۆمبێل</option>
                    <option value="games">🎮 یاریە ئەلیکترۆنیەکان</option>
                </select>
            </div>

            <button id="start-game-btn" class="btn-gold">▶️ دەستپێکردنی یاری</button>
        </div>

        <!-- Game Arena -->
        <div id="game-arena" class="game-arena hidden">
            <!-- VS Header -->
            <div class="vs-header">
                <div class="player-card" id="p1-card">
                    <span class="player-name" id="p1-name">ئارام</span>
                    <div class="timer-bar">
                        <div class="timer-fill" id="p1-fill"></div>
                    </div>
                    <div class="timer-text" id="p1-timer">45.0</div>
                </div>
                <div class="vs-divider">⚡ VS ⚡</div>
                <div class="player-card" id="p2-card">
                    <span class="player-name" id="p2-name">ژوان</span>
                    <div class="timer-bar">
                        <div class="timer-fill" id="p2-fill"></div>
                    </div>
                    <div class="timer-text" id="p2-timer">45.0</div>
                </div>
            </div>

            <!-- Image Box -->
            <div class="image-box">
                <img id="current-image" src="" alt="وێنە">
                <div class="category-badge" id="category-badge">ئاژەڵان</div>
            </div>

            <!-- Answer Controls -->
            <div class="answer-area">
                <input type="text" id="answer-input" placeholder="وەڵامەکەت لێرە بنووسە..." autocomplete="off">
                <div class="action-buttons">
                    <button id="check-answer" class="btn-check">✅ وەڵام بدەرەوە</button>
                    <button id="pass-btn" class="btn-pass">⏭️ پەڕاندن (3 چرکە سزا)</button>
                </div>
            </div>

            <!-- Game Status -->
            <div id="game-status" class="game-status"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
