<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHARIN ALI | Portfolio</title>
  <meta name="description" content="Portfolio website for SHARIN ALI, Graphic Designer and Video Editor." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#home" class="brand" id="brandName">شارین عەلی</a>
      <nav class="nav">
        <a href="#home" id="navHome">سەرەکی</a>
        <a href="#tabs" id="navTabs">بەشەکان</a>
        <a href="#contact-area" id="navContact">پەیوەندی</a>
      </nav>
      <button class="lang-btn" id="langBtn" type="button">کوردی</button>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="container hero-inner">
        <div class="hero-text">
          <!-- job لابرا -->
          <h1 id="heroTitle">سڵاو، من شارین عەلیم</h1>
          <p id="heroDescription">بەخێربێیت بۆ پۆرتفۆلیۆی من. لێرە دەتوانیت زانیارییەکانم، ئەزموونم، دیزاینی وێنەکانم و پڕۆژەی ڤیدیۆکانم ببینیت.</p>
          <!-- دوگمەی بینینی بەشەکان لابرا -->
        </div>
        <div class="hero-card">
          <div class="avatar">SA</div>
          <h2 id="cardName">SHARIN ALI</h2>
          <p id="cardJob">Graphic Designer & Video Editor</p>
        </div>
      </div>
    </section>

    <section class="tabs-section" id="tabs">
      <div class="container">
        <div class="tabs" id="tabButtons"></div>
        <div class="tab-panel" id="tabPanel"></div>
      </div>
    </section>

    <section class="contact-area" id="contact-area">
      <div class="container">
        <div class="simple-box" id="contactBox"></div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footerText">Graphic Designer Portfolio Website Design by SHARIN ALI</footer>

  <div class="lightbox" id="lightbox">
    <button id="closeLightbox" type="button">×</button>
    <img id="lightboxImg" alt="Preview" />
  </div>

  <script src="script.js"></script>
</body>
</html>
