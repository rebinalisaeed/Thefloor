<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Floor - Full Screen Duel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="setup-screen">
        <div class="setup-card">
            <h1>⚡ THE FLOOR ⚡</h1>
            <p>دوارەکە - هەڵبژاردنی یاریزانان و بابەت</p>
            
            <div class="setup-group">
                <label>🎮 یاریکەری یەکەم</label>
                <select id="player1-select"></select>
            </div>
            
            <div class="setup-group">
                <label>⚔️ یاریکەری دووەم</label>
                <select id="player2-select"></select>
            </div>
            
            <div class="setup-group">
                <label>📂 بابەت (کاتەگۆری)</label>
                <select id="category-select"></select>
            </div>
            
            <button id="start-game-btn" class="btn-start">▶️ دەستپێکردنی یاری</button>
            <div id="loading-status" style="color:#D4AF37; margin-top:15px; font-size:0.9rem;"></div>
        </div>
    </div>

    <!-- Game Screen (Full Screen) -->
    <div id="game-screen" class="game-screen hidden">
        <img id="game-image" class="game-image" alt="وێنەی یاری">
        
        <!-- Bottom 15% Overlay -->
        <div class="game-overlay">
            <div class="players-info">
                <div class="player-info" id="p1-info">
                    <span class="player-name-display" id="p1-name">Player 1</span>
                    <span class="player-time" id="p1-time">00.0</span>
                </div>
                <div class="vs-middle">
                    <span id="correct-badge">❓</span>
                </div>
                <div class="player-info" id="p2-info">
                    <span class="player-name-display" id="p2-name">Player 2</span>
                    <span class="player-time" id="p2-time">00.0</span>
                </div>
            </div>
            <div class="status-message" id="status-msg"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
